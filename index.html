<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Habit Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#2d2d2d;color:#222;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:18px;}

/* === MAIN FRAME === */
.frame{background:#c8c0b8;border:3px solid #555;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,0.6);width:100%;max-width:1400px;padding:14px;position:relative;}

/* === HEADER === */
.header-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
.title-block{background:#3a3a3a;color:#fff;padding:14px 22px;border-radius:8px;text-align:center;min-width:170px;}
.title-block h1{font-size:18px;letter-spacing:1px;margin-bottom:2px;}
.title-block h2{font-size:13px;font-weight:400;color:#f5a623;letter-spacing:0.5px;}
.calendar-settings{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;}
.calendar-settings .label{background:#3a3a3a;color:#fff;padding:3px 10px;border-radius:3px;font-size:10px;letter-spacing:0.5px;}
.calendar-settings .row{display:flex;align-items:center;gap:4px;}
.calendar-settings select,.calendar-settings input{background:#fff;border:1px solid #999;border-radius:3px;padding:2px 6px;font-size:11px;font-family:inherit;cursor:pointer;}
.calendar-settings select{min-width:90px;}

/* === CHARTS AREA === */
.charts-area{display:flex;gap:10px;flex:1;min-width:0;}
.chart-box{background:#e8e0d8;border:1px solid #aaa;border-radius:6px;padding:10px;flex:1;min-width:0;}
.chart-box h3{font-size:12px;font-weight:700;margin-bottom:6px;text-align:center;}
.chart-box canvas{width:100%!important;display:block;}

/* === STATS BOXES === */
.stats-col{display:flex;flex-direction:column;gap:6px;min-width:120px;}
.stat-box{background:#e8e0d8;border:1px solid #aaa;border-radius:6px;padding:10px 14px;text-align:center;}
.stat-box .val{font-size:22px;font-weight:800;color:#333;}
.stat-box .lbl{font-size:10px;font-weight:700;text-transform:uppercase;color:#666;letter-spacing:0.5px;}

/* === OVERALL DONUT === */
.overall-box{background:#e8e0d8;border:1px solid #aaa;border-radius:6px;padding:10px;min-width:180px;text-align:center;}
.overall-box h3{font-size:11px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;}
.donut-wrap{position:relative;display:inline-block;}
.donut-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.donut-label .pct{font-size:16px;font-weight:800;}
.donut-label .sub{font-size:9px;color:#777;}

/* === HABIT GRID === */
.habits-section{margin-top:10px;}
.habits-section h3{font-size:13px;font-weight:700;margin-bottom:4px;}
.habit-grid-wrap{overflow-x:auto;background:#e8e0d8;border:1px solid #aaa;border-radius:6px;}
table.habit-grid{border-collapse:collapse;width:100%;font-size:11px;}
table.habit-grid th,table.habit-grid td{border:1px solid #bbb;padding:2px 3px;text-align:center;white-space:nowrap;}
table.habit-grid thead th{background:#d0c8c0;font-weight:700;font-size:10px;color:#444;position:sticky;top:0;z-index:2;}
table.habit-grid .week-header{background:#b8b0a8;font-weight:800;font-size:10px;color:#333;text-align:center;letter-spacing:0.5px;}
table.habit-grid .habit-name-cell{text-align:left;padding-left:6px;font-weight:600;font-size:11px;background:#ddd8d0;min-width:160px;white-space:nowrap;cursor:default;}
table.habit-grid .habit-name-cell .emoji{margin-right:4px;}
table.habit-grid .day-header{font-size:9px;font-weight:700;color:#555;}
table.habit-grid .day-num{font-size:9px;color:#888;font-weight:600;}

/* Checkbox cells */
.cb-cell{width:26px;height:22px;cursor:pointer;vertical-align:middle;}
.cb-cell input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#4a7c59;}

/* Habit row hover */
table.habit-grid tbody tr:hover .habit-name-cell{background:#d0ccc4;}

/* === BOTTOM SECTION === */
.bottom-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.bottom-left{flex:1;min-width:300px;display:flex;flex-direction:column;gap:10px;}
.bottom-right{display:flex;flex-direction:column;gap:10px;min-width:300px;}

/* Mood row */
.mood-section{background:#e8e0d8;border:1px solid #aaa;border-radius:6px;padding:8px 10px;}
.mood-section .mood-label{font-size:11px;font-weight:700;margin-bottom:2px;}
.mood-row{display:flex;gap:1px;flex-wrap:wrap;}
.mood-val{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:1px solid #bbb;background:#ddd8d0;cursor:pointer;border-radius:2px;user-select:none;}
.mood-val:hover{background:#ccc5bb;}
.mood-val.level-1{background:#e8a0a0;color:#8b0000;}
.mood-val.level-2{background:#e8c0a0;color:#8b4500;}
.mood-val.level-3{background:#e8d8a0;color:#6b6b00;}
.mood-val.level-4{background:#c0e8a0;color:#2e6b00;}
.mood-val.level-5{background:#a0c8e8;color:#00458b;}
.mood-val.level-6{background:#a0e8a0;color:#006b00;}
.mood-val.level-7{background:#90d890;color:#005500;}
.mood-val.level-8{background:#70c870;color:#004400;}
.mood-val.level-9{background:#50b850;color:#003300;}
.mood-val.level-10{background:#30a830;color:#002200;}

/* Mental Stats chart */
.mental-box{background:#e8e0d8;border:1px solid #aaa;border-radius:6px;padding:8px 10px;text-align:center;}
.mental-box h3{font-size:11px;font-weight:700;margin-bottom:4px;}
.mental-box canvas{width:100%!important;display:block;}
.mental-legend{display:flex;gap:12px;justify-content:center;margin-top:4px;font-size:10px;}
.mental-legend span{display:flex;align-items:center;gap:3px;}
.mental-legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

/* Analysis table */
.analysis-box{background:#e8e0d8;border:1px solid #aaa;border-radius:6px;padding:8px 10px;}
.analysis-box h3{font-size:11px;font-weight:700;margin-bottom:4px;text-align:center;text-transform:uppercase;letter-spacing:1px;}
table.analysis-tbl{border-collapse:collapse;width:100%;font-size:10px;}
table.analysis-tbl th,table.analysis-tbl td{border:1px solid #bbb;padding:3px 6px;text-align:center;}
table.analysis-tbl th{background:#d0c8c0;font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;}
table.analysis-tbl td:first-child{text-align:left;font-weight:600;}
.progress-bar{width:50px;height:8px;background:#ccc;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;}
.progress-fill{height:100%;border-radius:4px;}

/* Top 10 */
.top10-box{background:#e8e0d8;border:1px solid #aaa;border-radius:6px;padding:8px 10px;}
.top10-box h3{font-size:11px;font-weight:700;margin-bottom:6px;text-align:center;text-transform:uppercase;letter-spacing:1px;}
.top10-list{list-style:none;font-size:11px;}
.top10-list li{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #ccc5bb;}
.top10-list li:last-child{border-bottom:none;}
.top10-rank{font-weight:800;min-width:18px;text-align:right;color:#555;}
.top10-name{flex:1;}
.top10-emoji{font-size:13px;}

/* === BUTTONS === */
.btn{padding:4px 12px;border-radius:4px;border:1px solid #999;background:#d8d0c8;color:#333;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s;}
.btn:hover{background:#c0b8b0;}
.btn-add{background:#4a7c59;color:#fff;border-color:#3a6c49;}
.btn-add:hover{background:#3a6c49;}
.btn-sm{padding:2px 8px;font-size:10px;}

/* === HABIT MANAGE BAR === */
.manage-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}

/* === MODAL === */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal{background:#d8d0c8;border:2px solid #888;border-radius:8px;padding:20px;width:380px;max-width:95vw;box-shadow:0 8px 30px rgba(0,0,0,0.4);}
.modal h2{font-size:15px;margin-bottom:14px;color:#333;}
.modal label{display:block;font-size:11px;font-weight:700;margin-bottom:4px;color:#555;}
.modal input[type=text],.modal select{width:100%;padding:6px 10px;border:1px solid #999;border-radius:4px;font-size:12px;font-family:inherit;background:#fff;margin-bottom:10px;}
.modal input[type=color]{width:100%;height:36px;border:1px solid #999;border-radius:4px;cursor:pointer;margin-bottom:10px;padding:2px;}
.emoji-grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.emoji-opt{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid transparent;border-radius:6px;cursor:pointer;background:#fff;transition:border-color 0.15s;}
.emoji-opt:hover,.emoji-opt.sel{border-color:#4a7c59;background:#e8f5e9;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}

/* === RESPONSIVE === */
@media(max-width:900px){.header-row{flex-direction:column;}.charts-area{flex-direction:column;}.bottom-row{flex-direction:column;}}
</style>
</head>
<body>

<div class="frame">

  <!-- ===== TOP ROW ===== -->
  <div class="header-row">

    <!-- Title -->
    <div class="title-block">
      <h1>HABIT TRACKER</h1>
      <h2 id="subtitleMonth">~JANUARY~</h2>
    </div>

    <!-- Calendar Settings -->
    <div class="calendar-settings">
      <div class="label">CALENDAR SETTINGS</div>
      <div class="row"><span class="label">YEAR</span><input type="number" id="yearInput" min="2020" max="2040" style="width:70px;"/></div>
      <div class="row"><span class="label">MONTH</span><select id="monthSelect"></select></div>
    </div>

    <!-- Daily Progress Chart -->
    <div class="chart-box" style="max-width:280px;">
      <h3>Daily Progress</h3>
      <canvas id="dailyChart" height="110"></canvas>
    </div>

    <!-- Weekly Progress Chart -->
    <div class="chart-box" style="max-width:250px;">
      <h3>Weekly Progress</h3>
      <canvas id="weeklyChart" height="110"></canvas>
    </div>

    <!-- Stats -->
    <div class="stats-col">
      <div class="stat-box"><div class="lbl">Goal</div><div class="val" id="statGoal">0</div></div>
      <div class="stat-box"><div class="lbl">Completed</div><div class="val" id="statDone">0</div></div>
      <div class="stat-box"><div class="lbl">Left</div><div class="val" id="statLeft">0</div></div>
    </div>

    <!-- Overall Stats Donut -->
    <div class="overall-box">
      <h3>Overall Stats</h3>
      <div class="donut-wrap">
        <canvas id="donutChart" width="130" height="130"></canvas>
        <div class="donut-label">
          <div class="pct" id="donutPct">0%</div>
          <div class="sub" id="donutSub">0%</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ===== HABIT GRID ===== -->
  <div class="habits-section">
    <div class="manage-bar">
      <h3>My Habits</h3>
      <button class="btn btn-add" onclick="openAddHabit()">+ Add Habit</button>
      <button class="btn btn-sm" onclick="exportData()" title="Export data as JSON">Export</button>
      <button class="btn btn-sm" onclick="importData()" title="Import JSON data">Import</button>
    </div>
    <div class="habit-grid-wrap">
      <table class="habit-grid" id="habitGrid">
        <thead id="gridHead"></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===== BOTTOM ROW ===== -->
  <div class="bottom-row">

    <!-- Left: Mood + Mental Stats -->
    <div class="bottom-left">
      <div class="mood-section">
        <div class="mood-label">Mood</div>
        <div class="mood-row" id="moodRow"></div>
        <div class="mood-label" style="margin-top:4px;">Motivation</div>
        <div class="mood-row" id="motivRow"></div>
      </div>
      <div class="mental-box">
        <h3>Mental Stats</h3>
        <canvas id="mentalChart" height="130"></canvas>
        <div class="mental-legend">
          <span><span class="dot" style="background:#e07050;"></span> Mood</span>
          <span><span class="dot" style="background:#d4a050;"></span> Motivation</span>
        </div>
      </div>
    </div>

    <!-- Right: Analysis + Top 10 -->
    <div class="bottom-right">
      <div class="analysis-box">
        <h3>Analysis</h3>
        <table class="analysis-tbl">
          <thead><tr><th></th><th>Goal</th><th>Actual</th><th>Left</th><th>Progress</th><th>%</th></tr></thead>
          <tbody id="analysisBody"></tbody>
        </table>
      </div>
      <div class="top10-box">
        <h3>Top 10 Daily Habits</h3>
        <ol class="top10-list" id="top10List"></ol>
      </div>
    </div>

  </div>

</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="habitModal">
  <div class="modal">
    <h2 id="modalTitle">Add New Habit</h2>
    <label>Habit Name</label>
    <input type="text" id="inputName" placeholder="e.g. Read 10 pages" maxlength="40"/>
    <label>Icon</label>
    <div class="emoji-grid" id="emojiGrid"></div>
    <label>Color</label>
    <input type="color" id="inputColor" value="#4a7c59"/>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-add" onclick="saveHabit()">Save</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none"/>

<script>
// =============================================
//           HABIT TRACKER APPLICATION
// =============================================

const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY_NAMES=['Mo','Tu','We','Th','Fr','Sa','Su'];
const DAY_NAMES_FULL=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const EMOJIS=[];

let currentYear, currentMonth;
let data={};
let editingId=null;
let selectedEmoji='';

// === INIT ===
function init(){
  loadData();
  const now=new Date();
  currentYear=now.getFullYear();
  currentMonth=now.getMonth();

  // Check if we need to auto-refresh for a new month
  autoRefreshMonth();

  // Build month selector
  const sel=document.getElementById('monthSelect');
  MONTH_NAMES.forEach((m,i)=>{const o=document.createElement('option');o.value=i;o.textContent=m;sel.appendChild(o);});
  sel.value=currentMonth;
  document.getElementById('yearInput').value=currentYear;

  sel.addEventListener('change',()=>{currentMonth=parseInt(sel.value);render();});
  document.getElementById('yearInput').addEventListener('change',(e)=>{currentYear=parseInt(e.target.value);render();});

  if(!data.habits||data.habits.length===0){
    data.habits=[
      {id:uid(),name:'Wake up at 6:00 AM',emoji:'',color:'#6c5ce7'},
      {id:uid(),name:'Cold Shower',emoji:'',color:'#0984e3'},
      {id:uid(),name:'Plan the day',emoji:'',color:'#00b894'},
      {id:uid(),name:'Work',emoji:'',color:'#fdcb6e'},
      {id:uid(),name:'No sugar',emoji:'',color:'#e17055'},
      {id:uid(),name:'No Alcohol',emoji:'',color:'#d63031'},
      {id:uid(),name:'Read 10 pages',emoji:'',color:'#0984e3'},
      {id:uid(),name:'Meditation',emoji:'',color:'#6c5ce7'},
      {id:uid(),name:'Yoga',emoji:'',color:'#00cec9'},
      {id:uid(),name:'Social media less than 1H',emoji:'',color:'#e94560'},
      {id:uid(),name:'Gym',emoji:'',color:'#f5a623'},
      {id:uid(),name:'Talk with friends',emoji:'',color:'#fd79a8'},
    ];
    saveData();
  }
  buildEmojiGrid();
  render();
}

// === AUTO REFRESH: clear checks when a new month starts ===
function autoRefreshMonth(){
  const now=new Date();
  const currentMK=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const lastActiveMonth=data.lastActiveMonth||'';
  if(lastActiveMonth && lastActiveMonth!==currentMK){
    // New month detected — checks for the NEW month start blank automatically
    // (we don't delete old data, new month just has no entries yet)
    // But we record that we've entered this month
  }
  data.lastActiveMonth=currentMK;
  saveData();
}

// === PERSISTENCE ===
function loadData(){try{const r=localStorage.getItem('ht_data');data=r?JSON.parse(r):{};}catch(e){data={};}
if(!data.habits)data.habits=[];if(!data.checks)data.checks={};if(!data.mood)data.mood={};if(!data.motivation)data.motivation={};}
function saveData(){localStorage.setItem('ht_data',JSON.stringify(data));}

// === UTILS ===
function uid(){return Math.random().toString(36).substr(2,9);}
function mk(){return `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;}
function daysInMonth(){return new Date(currentYear,currentMonth+1,0).getDate();}
// ISO weekday: Mon=0 ... Sun=6
function isoDow(d){const dow=new Date(currentYear,currentMonth,d).getDay();return dow===0?6:dow-1;}

// === RENDER ALL ===
function render(){
  document.getElementById('subtitleMonth').textContent=`~${MONTH_NAMES[currentMonth].toUpperCase()}~`;
  document.getElementById('monthSelect').value=currentMonth;
  document.getElementById('yearInput').value=currentYear;
  renderStats();
  renderGrid();
  renderAnalysis();
  renderTop10();
  renderMoodRows();
  renderDailyChart();
  renderWeeklyChart();
  renderDonut();
  renderMentalChart();
}

// === STATS ===
function renderStats(){
  const days=daysInMonth(),h=data.habits,goal=h.length*days;
  let done=0;const ck=data.checks[mk()]||{};
  h.forEach(hb=>{for(let d=1;d<=days;d++){if(ck[hb.id]&&ck[hb.id][d])done++;}});
  document.getElementById('statGoal').textContent=goal;
  document.getElementById('statDone').textContent=done;
  document.getElementById('statLeft').textContent=goal-done;
}

// === HABIT GRID ===
function renderGrid(){
  const days=daysInMonth();
  const mkey=mk();
  if(!data.checks[mkey])data.checks[mkey]={};
  const today=new Date();
  const isNow=today.getFullYear()===currentYear&&today.getMonth()===currentMonth;
  const todayD=today.getDate();

  // Figure out weeks
  // Group days into weeks (Mon-Sun)
  const weeks=[];
  let currentWeek=[];
  for(let d=1;d<=days;d++){
    const dow=isoDow(d); // 0=Mon
    if(dow===0&&currentWeek.length>0){weeks.push(currentWeek);currentWeek=[];}
    currentWeek.push(d);
  }
  if(currentWeek.length>0)weeks.push(currentWeek);

  // === HEADER ROW 1: Week labels ===
  let h1='<tr><th rowspan="3" style="min-width:160px;text-align:left;padding-left:8px;">My Habits</th>';
  weeks.forEach((w,i)=>{
    h1+=`<th class="week-header" colspan="${w.length}">Week ${i+1}</th>`;
  });
  h1+='</tr>';

  // === HEADER ROW 2: Day names ===
  let h2='<tr>';
  for(let d=1;d<=days;d++){
    const dow=isoDow(d);
    h2+=`<th class="day-header">${DAY_NAMES[dow]}</th>`;
  }
  h2+='</tr>';

  // === HEADER ROW 3: Day numbers ===
  let h3='<tr>';
  for(let d=1;d<=days;d++){
    const cls=isNow&&d===todayD?'color:#c0392b;font-weight:800;':'';
    h3+=`<th class="day-num" style="${cls}">${d}</th>`;
  }
  h3+='</tr>';

  document.getElementById('gridHead').innerHTML=h1+h2+h3;

  // === BODY: Habit rows ===
  let body='';
  data.habits.forEach(hb=>{
    if(!data.checks[mkey][hb.id])data.checks[mkey][hb.id]={};
    body+='<tr>';
    body+=`<td class="habit-name-cell"><span class="emoji">${hb.emoji}</span>${hb.name}
      <span style="float:right;display:inline-flex;gap:2px;">
        <span style="cursor:pointer;font-size:12px;" onclick="editHabit('${hb.id}')" title="Edit">[EDIT]</span>
        <span style="cursor:pointer;font-size:12px;" onclick="deleteHabit('${hb.id}')" title="Delete">[DEL]</span>
      </span>
    </td>`;
    for(let d=1;d<=days;d++){
      const checked=!!data.checks[mkey][hb.id][d];
      body+=`<td class="cb-cell"><input type="checkbox" ${checked?'checked':''} onchange="toggleDay('${hb.id}',${d},this.checked)"/></td>`;
    }
    body+='</tr>';
  });
  document.getElementById('gridBody').innerHTML=body;
}

// === TOGGLE ===
function toggleDay(hid,day,val){
  const mkey=mk();
  if(!data.checks[mkey])data.checks[mkey]={};
  if(!data.checks[mkey][hid])data.checks[mkey][hid]={};
  if(val)data.checks[mkey][hid][day]=true;
  else delete data.checks[mkey][hid][day];
  saveData();
  // Re-render stats & charts but NOT the grid (to keep checkbox state smooth)
  renderStats();renderAnalysis();renderTop10();renderDailyChart();renderWeeklyChart();renderDonut();
}

// === ANALYSIS TABLE ===
function renderAnalysis(){
  const days=daysInMonth(),mkey=mk(),ck=data.checks[mkey]||{};
  let html='';
  data.habits.forEach(hb=>{
    let actual=0;const hc=ck[hb.id]||{};
    for(let d=1;d<=days;d++){if(hc[d])actual++;}
    const left=days-actual;
    const pct=Math.round(actual/days*100);
    const color=pct>=80?'#4a7c59':pct>=50?'#c0960a':'#c0392b';
    html+=`<tr>
      <td style="text-align:left;">${hb.emoji} ${hb.name}</td>
      <td>${days}</td>
      <td>${actual}</td>
      <td>${left}</td>
      <td><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color};"></div></div></td>
      <td style="font-weight:700;color:${color};">${pct.toFixed(2)}%</td>
    </tr>`;
  });
  document.getElementById('analysisBody').innerHTML=html;
}

// === TOP 10 ===
function renderTop10(){
  const days=daysInMonth(),mkey=mk(),ck=data.checks[mkey]||{};
  const ranked=data.habits.map(hb=>{
    let actual=0;const hc=ck[hb.id]||{};
    for(let d=1;d<=days;d++){if(hc[d])actual++;}
    return{...hb,pct:Math.round(actual/days*100)};
  }).sort((a,b)=>b.pct-a.pct).slice(0,10);

  let html='';
  ranked.forEach((h,i)=>{
    html+=`<li><span class="top10-rank">${i+1}</span><span class="top10-name">${h.name}</span><span class="top10-emoji">${h.emoji}</span></li>`;
  });
  document.getElementById('top10List').innerHTML=html;
}

// === MOOD ROWS ===
function renderMoodRows(){
  const days=daysInMonth(),mkey=mk();
  const md=data.mood[mkey]||{};
  const mt=data.motivation[mkey]||{};
  let mh='',mvh='';
  for(let d=1;d<=days;d++){
    const mv=md[d]!==undefined?md[d]:'';
    const mtv=mt[d]!==undefined?mt[d]:'';
    const mcls=mv?` level-${mv}`:'';
    const mtcls=mtv?` level-${mtv}`:'';
    mh+=`<div class="mood-val${mcls}" onclick="cycleMood('mood',${d})" title="Day ${d}">${mv||'-'}</div>`;
    mvh+=`<div class="mood-val${mtcls}" onclick="cycleMood('motivation',${d})" title="Day ${d}">${mtv||'-'}</div>`;
  }
  document.getElementById('moodRow').innerHTML=mh;
  document.getElementById('motivRow').innerHTML=mvh;
}

function cycleMood(type,day){
  const mkey=mk();
  if(!data[type][mkey])data[type][mkey]={};
  const cur=data[type][mkey][day]||0;
  data[type][mkey][day]=cur>=10?0:cur+1;
  if(data[type][mkey][day]===0)delete data[type][mkey][day];
  saveData();
  renderMoodRows();
  renderMentalChart();
}

// === DONUT ===
function renderDonut(){
  const canvas=document.getElementById('donutChart');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,130,130);
  const days=daysInMonth(),h=data.habits,goal=h.length*days;
  let done=0;const ck=data.checks[mk()]||{};
  h.forEach(hb=>{for(let d=1;d<=days;d++){if(ck[hb.id]&&ck[hb.id][d])done++;}});
  const pct=goal>0?done/goal:0;
  const left=1-pct;
  const cx=65,cy=65,r=52,lw=18;

  // Background
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#ccc5bb';ctx.lineWidth=lw;ctx.stroke();

  // Done slice (pinkish like screenshot)
  if(pct>0){
    ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
    ctx.strokeStyle='#d4956a';ctx.lineWidth=lw;ctx.lineCap='butt';ctx.stroke();
  }
  // Left slice (grey like screenshot)
  if(left>0){
    ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2+Math.PI*2*pct,-Math.PI/2+Math.PI*2);
    ctx.strokeStyle='#a8a098';ctx.lineWidth=lw;ctx.lineCap='butt';ctx.stroke();
  }

  const pctVal=Math.round(pct*100);
  const leftPct=(100-pctVal);
  document.getElementById('donutPct').textContent=pctVal+'%';
  document.getElementById('donutSub').textContent=leftPct+'%';
}

// === DAILY CHART (Bar) ===
function renderDailyChart(){
  const canvas=document.getElementById('dailyChart');
  const ctx=canvas.getContext('2d');
  const W=canvas.parentElement.clientWidth-20;
  canvas.width=W;canvas.height=110;
  ctx.clearRect(0,0,W,110);

  const days=daysInMonth(),h=data.habits,total=h.length;
  if(total===0)return;
  const mkey=mk(),ck=data.checks[mkey]||{};
  const vals=[];
  for(let d=1;d<=days;d++){
    let c=0;h.forEach(hb=>{if(ck[hb.id]&&ck[hb.id][d])c++;});
    vals.push(total>0?c/total*100:0);
  }

  const pad=28,chartH=75;
  const barW=Math.max(3,(W-pad-10)/days-1.5);

  // Y axis
  ctx.fillStyle='#777';ctx.font='9px sans-serif';
  [0,25,50,75,100].forEach(p=>{
    const y=8+chartH-(p/100)*chartH;
    ctx.fillText(p+'%',0,y+3);
    ctx.strokeStyle='#bbb';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-4,y);ctx.stroke();
  });

  // Bars
  vals.forEach((v,i)=>{
    const x=pad+i*((W-pad-4)/days);
    const bh=(v/100)*chartH;
    const y=8+chartH-bh;
    ctx.fillStyle=v>=75?'#555':v>=50?'#777':'#999';
    ctx.fillRect(x,y,barW,bh);
  });
}

// === WEEKLY CHART (Bar) ===
function renderWeeklyChart(){
  const canvas=document.getElementById('weeklyChart');
  const ctx=canvas.getContext('2d');
  const W=canvas.parentElement.clientWidth-20;
  canvas.width=W;canvas.height=110;
  ctx.clearRect(0,0,W,110);

  const days=daysInMonth(),h=data.habits,total=h.length;
  if(total===0)return;
  const mkey=mk(),ck=data.checks[mkey]||{};

  // Build weeks
  const weeks=[];let wk={done:0,goal:0};
  for(let d=1;d<=days;d++){
    const dow=isoDow(d);
    if(dow===0&&wk.goal>0){weeks.push(wk);wk={done:0,goal:0};}
    h.forEach(hb=>{wk.goal++;if(ck[hb.id]&&ck[hb.id][d])wk.done++;});
  }
  if(wk.goal>0)weeks.push(wk);

  const vals=weeks.map(w=>w.goal>0?w.done/w.goal*100:0);
  const pad=28,chartH=75;
  const barW=Math.min(35,(W-pad-20)/weeks.length-8);

  // Y axis
  ctx.fillStyle='#777';ctx.font='9px sans-serif';
  [0,25,50,75,100].forEach(p=>{
    const y=8+chartH-(p/100)*chartH;
    ctx.fillText(p+'%',0,y+3);
    ctx.strokeStyle='#bbb';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-4,y);ctx.stroke();
  });

  vals.forEach((v,i)=>{
    const x=pad+i*((W-pad-4)/vals.length)+10;
    const bh=(v/100)*chartH;
    const y=8+chartH-bh;
    ctx.fillStyle='#888';
    ctx.fillRect(x,y,barW,bh);
    // Week label
    ctx.fillStyle='#666';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText('W'+(i+1),x+barW/2,8+chartH+12);
    ctx.textAlign='start';
  });
}

// === MENTAL STATS AREA CHART ===
function renderMentalChart(){
  const canvas=document.getElementById('mentalChart');
  const ctx=canvas.getContext('2d');
  const W=canvas.parentElement.clientWidth-20;
  canvas.width=W;canvas.height=130;
  ctx.clearRect(0,0,W,130);

  const days=daysInMonth(),mkey=mk();
  const md=data.mood[mkey]||{};
  const mt=data.motivation[mkey]||{};
  const pad=22,chartH=95,chartW=W-pad-10;

  // Grid
  ctx.fillStyle='#999';ctx.font='9px sans-serif';
  for(let i=0;i<=10;i+=2){
    const y=8+chartH-(i/10)*chartH;
    ctx.strokeStyle='#ccc';ctx.lineWidth=0.3;
    ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-4,y);ctx.stroke();
    ctx.fillText(i,4,y+3);
  }

  function drawArea(vals,lineColor,fillColor){
    const pts=[];
    for(let d=1;d<=days;d++){
      if(vals[d]!==undefined){
        const x=pad+((d-1)/(days-1))*chartW;
        const y=8+chartH-(vals[d]/10)*chartH;
        pts.push({x,y});
      }
    }
    if(pts.length<2)return;
    // Fill
    ctx.beginPath();ctx.moveTo(pts[0].x,8+chartH);
    pts.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.lineTo(pts[pts.length-1].x,8+chartH);ctx.closePath();
    ctx.fillStyle=fillColor;ctx.fill();
    // Line
    ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.strokeStyle=lineColor;ctx.lineWidth=1.5;ctx.stroke();
  }

  drawArea(md,'#e07050','rgba(224,112,80,0.25)');
  drawArea(mt,'#d4a050','rgba(212,160,80,0.25)');

  // X labels
  ctx.fillStyle='#999';ctx.font='8px sans-serif';ctx.textAlign='center';
  for(let d=1;d<=days;d++){
    if(days<=16||d%2===1){
      const x=pad+((d-1)/(days-1))*chartW;
      ctx.fillText(d,x,8+chartH+12);
    }
  }
  ctx.textAlign='start';
}

// === ADD/EDIT HABIT ===
function buildEmojiGrid(){
  let html='';
  EMOJIS.forEach(e=>{html+=`<div class="emoji-opt${e===selectedEmoji?' sel':''}" onclick="pickEmoji(this,'${e}')">${e}</div>`;});
  document.getElementById('emojiGrid').innerHTML=html;
}
function pickEmoji(el,e){
  selectedEmoji=e;
  document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function openAddHabit(){
  editingId=null;selectedEmoji='';
  document.getElementById('modalTitle').textContent='Add New Habit';
  document.getElementById('inputName').value='';
  document.getElementById('inputColor').value='#4a7c59';
  buildEmojiGrid();
  document.getElementById('habitModal').classList.add('show');
  setTimeout(()=>document.getElementById('inputName').focus(),100);
}
function editHabit(id){
  const h=data.habits.find(x=>x.id===id);if(!h)return;
  editingId=id;selectedEmoji=h.emoji;
  document.getElementById('modalTitle').textContent='Edit Habit';
  document.getElementById('inputName').value=h.name;
  document.getElementById('inputColor').value=h.color;
  buildEmojiGrid();
  document.getElementById('habitModal').classList.add('show');
  setTimeout(()=>document.getElementById('inputName').focus(),100);
}
function closeModal(){document.getElementById('habitModal').classList.remove('show');}
function saveHabit(){
  const name=document.getElementById('inputName').value.trim();
  if(!name){alert('Enter a habit name.');return;}
  const color=document.getElementById('inputColor').value;
  if(editingId){
    const h=data.habits.find(x=>x.id===editingId);
    if(h){h.name=name;h.emoji=selectedEmoji;h.color=color;}
  }else{
    data.habits.push({id:uid(),name,emoji:selectedEmoji,color});
  }
  saveData();closeModal();render();
}
function deleteHabit(id){
  if(!confirm('Delete this habit and all its data?'))return;
  data.habits=data.habits.filter(x=>x.id!==id);
  Object.keys(data.checks).forEach(k=>{delete data.checks[k][id];});
  saveData();render();
}

// === EXPORT / IMPORT ===
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`habit-tracker-${mk()}.json`;a.click();
}
function importData(){
  const inp=document.getElementById('fileInput');
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.habits){data=d;saveData();render();alert('Imported!');}
        else alert('Invalid file.');
      }catch{alert('Failed to parse.');}
    };
    r.readAsText(f);inp.value='';
  };
  inp.click();
}

// === EVENTS ===
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('habitModal').addEventListener('click',e=>{if(e.target.id==='habitModal')closeModal();});

let resizeT;window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(render,200);});

// === GO ===
init();
